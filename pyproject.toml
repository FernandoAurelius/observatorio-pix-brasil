[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio-pix-brasil"
version = "1.0.0"
description = "Laboratorio estatistico brasileiro com nucleo proprio e API oficial do BCB"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["pacotes", "aplicacoes/api"]

[tool.pytest.ini_options]
pythonpath = ["pacotes", "aplicacoes/api"]
testpaths = ["testes"]
python_files = ["teste_*.py"]
python_functions = ["teste_*"]
addopts = "-ra"
markers = ["integracao_real: requer rede e a API oficial do BCB"]

[tool.coverage.run]
source = ["nucleo_estatistico", "observatorio_api"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"pacotes/nucleo_estatistico/__init__.py" = ["F401"]
"scripts/*.py" = ["E402"]
"testes/teste_nucleo.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
