services:
  api:
    build:
      context: .
      dockerfile: aplicacoes/api/Dockerfile
    environment:
      CACHE_SEGUNDOS: ${CACHE_SEGUNDOS:-86400}
      MAXIMO_MESES_CACHE: ${MAXIMO_MESES_CACHE:-36}
      ORIGENS_CORS: ${ORIGENS_CORS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  web:
    build:
      context: .
      dockerfile: aplicacoes/web/Dockerfile
      args:
        API_INTERNA: http://api:8000
    environment:
      API_INTERNA: http://api:8000
    ports:
      - "127.0.0.1:${PORTA_WEB:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
